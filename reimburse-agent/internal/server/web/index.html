<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>报销审核 AI 同事</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
  --fg:#e6e9ef; --dim:#9aa3b2; --faint:#6b7484;
  --ok:#3fb950; --warn:#d29922; --bad:#f85149; --info:#58a6ff; --purple:#a371f7;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.3px}
.badge{font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--dim)}
.badge.ok{color:var(--ok);border-color:#1d4025;background:#0d1f12}
.badge.bad{color:var(--bad);border-color:#5a2321;background:#22100f}
main{display:grid;grid-template-columns:250px minmax(320px,1fr) 330px;gap:12px;padding:12px;align-items:start}
@media (max-width:1000px){main{grid-template-columns:1fr}}
@media (max-width:700px){header{flex-wrap:wrap;gap:8px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.panel.right{position:sticky;top:74px;max-height:calc(100vh - 90px);display:flex;flex-direction:column}
.panel.right .body{overflow:auto}
.panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--faint);margin:0;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.panel .body{padding:12px 14px}
.case{display:flex;gap:8px;padding:8px 10px;border-radius:7px;cursor:pointer;border:1px solid transparent}
.case:hover{background:var(--panel2)}
.case.sel{background:#1b2230;border-color:#2f4a6f}
.case .id{font-family:var(--mono);color:var(--dim);font-size:12px;min-width:28px}
.case .t{font-size:13px;line-height:1.35}
.case .m{font-size:11px;color:var(--faint);margin-top:2px}
.tag{display:inline-block;font-size:10px;padding:0 5px;border-radius:4px;background:#2a2f3a;color:var(--dim);margin-right:4px}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
.filters button{font-size:12px;padding:3px 9px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer}
.filters button.on{background:#233043;border-color:#33507a;color:#cfe3ff}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
button.primary{background:#1f6feb;border:none;color:#fff;padding:7px 16px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600}
button.primary:disabled{background:#2a3140;color:var(--faint);cursor:not-allowed}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);padding:6px 12px;border-radius:7px;cursor:pointer;font-size:12px}
button.ghost:hover{color:var(--fg);border-color:#3b4252}
label.chk{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--dim);cursor:pointer}
select{background:var(--panel2);border:1px solid var(--line);color:var(--fg);padding:5px 8px;border-radius:6px;font-size:12px}
.steps{display:flex;gap:0;padding:10px 14px;border-bottom:1px solid var(--line);overflow-x:auto}
.step{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);white-space:nowrap}
.step .dot{width:7px;height:7px;border-radius:50%;background:#3b4252}
.step.active{color:var(--info)}
.step.active .dot{background:var(--info);box-shadow:0 0 0 3px #58a6ff22}
.step.done{color:var(--ok)}
.step.done .dot{background:var(--ok)}
.step .sep{width:26px;height:1px;background:var(--line);margin:0 8px}
#log{height:calc(100vh - 250px);min-height:320px;overflow:auto;padding:8px 0;font-size:13px}
.ev{display:grid;grid-template-columns:52px 74px minmax(0,1fr);gap:8px;padding:5px 14px;border-left:2px solid transparent}
.ev:hover{background:#1a1e26}
.ev .s{font-family:var(--mono);color:#4b5361;font-size:11px;text-align:right}
.ev .k{font-size:10px;padding:1px 0;letter-spacing:.4px;color:var(--faint)}
.ev .t{line-height:1.45}
.ev .d{color:var(--dim);font-size:12px;margin-top:2px;word-break:break-word}
.ev.llm_call{border-left-color:var(--purple)}
.ev.llm_call .k{color:var(--purple)}
.ev.llm_result .k{color:#8b949e}
.ev.tool_call{border-left-color:var(--info)}
.ev.tool_call .k{color:var(--info)}
.ev.tool_result{border-left-color:#2f6f9f}
.ev.tool_result .k{color:#6fa8dc}
.ev.finding{border-left-color:var(--warn)}
.ev.finding .k{color:var(--warn)}
.ev.decision{border-left-color:var(--ok);background:#0f1a12}
.ev.decision .k{color:var(--ok)}
.ev.warn{border-left-color:#6b3030;background:#1a1213}
.ev.warn .k{color:#d97a72}
.ev.fail{border-left-color:var(--bad);background:#1a1012}
.ev.fail .k{color:var(--bad)}
pre{margin:6px 0 0;padding:8px 10px;background:#0b0d11;border:1px solid var(--line);border-radius:6px;font-family:var(--mono);font-size:11.5px;line-height:1.5;overflow:auto;max-height:260px;color:#c3cad6}
.verdict{border-radius:10px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.verdict .big{font-size:22px;font-weight:700;letter-spacing:.5px}
.verdict .amt{font-family:var(--mono);font-size:15px;margin-top:4px;color:var(--dim)}
.v-approve{border-color:#1d4025;background:#0d1f12}
.v-approve .big{color:var(--ok)}
.v-approve_with_adjustment{border-color:#4a3b12;background:#1e1a0c}
.v-approve_with_adjustment .big{color:var(--warn)}
.v-manual_review{border-color:#3a3f52;background:#171b24}
.v-manual_review .big{color:#c9d1d9}
.v-need_more_info{border-color:#4a3b12;background:#1e1a0c}
.v-need_more_info .big{color:var(--warn)}
.v-reject{border-color:#5a2321;background:#22100f}
.v-reject .big{color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px;margin:6px 0}
.kv .k{color:var(--faint)}
.kv .v{color:var(--fg);word-break:break-all}
.finding-row{border-left:3px solid var(--warn);padding:6px 10px;margin:6px 0;background:#1a1810;border-radius:0 6px 6px 0}
.finding-row .h{font-size:12px;color:var(--warn);font-weight:600}
.finding-row .r{font-size:12px;color:var(--dim);margin-top:3px}
.op{white-space:pre-wrap;font-size:13px;line-height:1.7;background:#0b0d11;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.fieldtable{width:100%;border-collapse:collapse;font-size:12px}
.fieldtable th{text-align:left;color:var(--faint);font-weight:500;padding:3px 6px;border-bottom:1px solid var(--line)}
.fieldtable td{padding:3px 6px;border-bottom:1px solid #1d222b;font-family:var(--mono)}
.fieldtable tr.bad td{background:#22100f}
.fieldtable tr.bad td.v{color:#ff9b94}
.skipped{font-size:12px;color:var(--dim)}
.skipped details{margin:4px 0}
.skipped summary{cursor:pointer;color:var(--faint)}
.muted{color:var(--faint);font-size:12px}
.empty{color:var(--faint);font-size:13px;padding:20px;text-align:center}
.spin{display:inline-block;width:10px;height:10px;border:2px solid #58a6ff44;border-top-color:var(--info);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.impact{background:#1e1a0c;border:1px solid #4a3b12;color:#e3c07b;font-size:11.5px;
  padding:6px 9px;border-radius:6px;margin:2px 0 8px;line-height:1.6}
.rvitem{font-size:11.5px;border-left:2px solid var(--line);padding:4px 8px;margin:4px 0;color:var(--dim)}
.rvitem.rev{opacity:.55;border-left-color:#6b3030}
.rvitem .who{color:var(--fg)}
.rvitem .what{color:var(--warn)}
.rvitem button{font-size:10.5px;padding:1px 7px;border-radius:4px;border:1px solid var(--line);
  background:transparent;color:var(--dim);cursor:pointer;margin-left:6px}
.warnbar{background:#1e1a0c;border:1px solid #4a3b12;color:#e3c07b;font-size:12px;padding:6px 10px;border-radius:6px;margin:6px 0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.split .panel{background:var(--panel2)}
.split h3{font-size:11px;color:var(--faint);margin:0 0 6px;text-transform:uppercase;letter-spacing:.5px}
#reviewNote{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:6px 8px;font-size:12px;font-family:inherit}
.reviewbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.reviewbtns button{flex:1;font-size:12px;padding:6px 4px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);cursor:pointer}
.reviewbtns button:hover{color:var(--fg);border-color:#3b4252}
</style>
</head>
<body>
<header>
  <h1>报销审核 · AI 同事</h1>
  <span id="m-rules" class="badge"></span>
  <span id="m-ds" class="badge"></span>
  <span id="m-cl" class="badge"></span>
  <span id="m-tools" class="badge"></span>
  <span style="flex:1"></span>
  <span id="m-quota" class="badge" title="本周 AI 用量"></span>
  <span id="m-cost" class="badge"></span>
</header>

<main>
  <section class="panel">
    <h2>待审单据 <span id="caseCount" class="muted"></span></h2>
    <div class="filters" id="filters"></div>
    <div id="cases"></div>
  </section>

  <section class="panel">
    <div class="toolbar">
      <button id="runBtn" class="primary" disabled>开始审核</button>
      <select id="explainSel" title="是否让模型润色审核意见">
        <option value="">意见：规则拼接</option>
        <option value="deepseek">意见：DeepSeek 润色</option>
        <option value="claude">意见：Claude 润色</option>
      </select>
      <label class="chk"><input type="checkbox" id="offClaude"> 关闭 Claude</label>
      <label class="chk"><input type="checkbox" id="offDeepseek"> 关闭 DeepSeek</label>
      <select id="faultSel" title="注入工具故障">
        <option value="">工具：正常</option>
        <option value="verify_invoice=timeout">发票查验超时</option>
        <option value="verify_invoice=error">发票查验报错</option>
        <option value="check_company=error">企业核验报错</option>
        <option value="check_history=timeout">历史查重超时</option>
      </select>
      <select id="whoSel" title="当前操作人（工号）"></select>
      <span style="flex:1"></span>
      <span id="runState" class="muted"></span>
    </div>
    <div class="steps" id="steps"></div>
    <div id="log"><div class="empty">选择左侧单据，点「开始审核」<br>过程会在这里逐条出现</div></div>
  </section>

  <section class="panel right">
    <h2>判定结果 <span id="elapsed" class="muted"></span></h2>
    <div class="body" id="result"><div class="empty">还没有结果</div></div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const S = {cases:[], cat:"all", sel:null, ses:null, es:null, evCount:0, report:null};

const DEC = {approve:"通过",approve_with_adjustment:"调整后通过",manual_review:"转人工复核",need_more_info:"退回补材料",reject:"驳回"};
const STAGE = [{k:"plan",n:"确定范围"},{k:"extract",n:"双模型抽取"},{k:"tools",n:"工具核验"},{k:"aggregate",n:"规则判定"},{k:"explain",n:"审核意见"}];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const yuan = f => "¥" + (f/100).toFixed(2);

async function jget(u){ const r = await fetch(u); if(!r.ok) throw new Error(await r.text()); return r.json(); }
async function jpost(u, b){ const r = await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}); if(!r.ok) throw new Error(await r.text()); return r.json(); }

async function boot(){
  const meta = await jget("/api/meta");
  $("#m-rules").textContent = `规则 ${meta.rules.count} 条 / 判定项 ${meta.rules.checks} 个`;
  const dm = meta.models.find(m=>m.provider==="deepseek"), cm = meta.models.find(m=>m.provider==="claude");
  $("#m-ds").textContent = `DeepSeek ${dm.key_ready?"就绪":"未配置密钥"}`;
  $("#m-ds").className = "badge " + (dm.key_ready?"ok":"");
  $("#m-cl").textContent = `Claude ${cm.key_ready?"就绪":"未配置密钥"}`;
  $("#m-cl").className = "badge " + (cm.key_ready?"ok":"");
  $("#m-tools").textContent = `MCP 工具 ${meta.tools.mode==="remote"?"远程":"进程内"} · 3 个`;
  if(!dm.key_ready && !cm.key_ready){
    $("#m-ds").title = "两种模式：配了密钥走真实模型；未配置时按启动参数决定回放录制或合成演示";
    const tip = document.createElement("span");
    tip.className = "badge";
    tip.textContent = "无密钥：见右侧数据来源提示";
    $("#m-cl").after(tip);
  }
  const st = await jget("/api/stats");
  $("#m-cost").textContent = `本次运行 ${st.sessions||0} 单 · 成本约 $${(st.cost_usd||0).toFixed(5)}`;
  renderSteps(null);
  await loadPeople();
  await loadQuota();
  await loadCases();
}

// loadPeople 拉工号名单，填充"当前操作人"；没有名单时禁用复核并说明原因。
async function loadPeople(){
  try{
    const d = await jget("/api/people");
    const sel = $("#whoSel");
    if(!d.people || d.people.length===0){
      sel.innerHTML = '<option value="">（未配置人员名单）</option>';
      sel.disabled = true;
      return;
    }
    sel.innerHTML = '<option value="">选择操作人</option>' +
      d.people.map(p=>`<option value="${esc(p.employee_id)}" ${p.can_review?"":"data-noreview=1"}>
        ${esc(p.employee_id)} ${esc(p.name)}${p.can_review?"":"（只读）"}</option>`).join("");
  }catch(e){ /* 名单接口失败不影响主流程 */ }
}

// loadQuota 更新顶部配额徽章与颜色。
async function loadQuota(){
  try{
    const d = await jget("/api/quota");
    const el = $("#m-quota");
    if(!d.enabled){ el.textContent = "预算：未启用"; el.className="badge"; return; }
    const st = d.status, cfg = d.config;
    const pct = (st.ratio*100).toFixed(0);
    el.textContent = `本周 $${st.used_usd.toFixed(2)} / $${st.budget_usd.toFixed(0)}（${pct}%）`;
    el.className = "badge " + (st.level==="ok"?"":st.level==="blocked"?"bad":"");
    el.title = st.level==="blocked"
      ? "预算已耗尽：自动审核已熔断，单据需转人工"
      : `预警 ${(cfg.warn_ratio*100).toFixed(0)}% / 严重 ${(cfg.critical_ratio*100).toFixed(0)}% / 熔断 100%`;
    if(st.blocked){
      const btn = $("#runBtn");
      if(btn && !btn.disabled){ btn.disabled = true; btn.title = "本周预算已耗尽"; }
    }
  }catch(e){}
}

// loadReviews 渲染复核记录（含撤销按钮）。
async function loadReviews(){
  const box = $("#reviewList");
  if(!box) return;
  try{
    const d = await jget("/api/reviews");
    if(!d.reviews || d.reviews.length===0){ box.innerHTML = ""; return; }
    box.innerHTML = '<h3 style="font-size:12px;color:var(--faint);margin:6px 0 4px">复核记录</h3>' +
      d.reviews.slice(0,6).map(r=>`<div class="rvitem ${r.revoked_at?"rev":""}">
        <span class="who">${esc(r.id)} · ${esc(r.operator_name||r.operator)}</span>
        <span class="what">${DEC[r.decision]||r.decision}</span>
        ${r.revoked_at?`<span style="color:var(--bad)">已撤销（${esc(r.revoked_by_name||r.revoked_by)}：${esc(r.revoke_reason||"")}）</span>`
          :`<button data-rv="${esc(r.id)}">撤销</button>`}
        <div style="margin-top:2px">${esc(r.note||"")}</div>
      </div>`).join("");
    box.querySelectorAll("button[data-rv]").forEach(b=>{
      b.onclick = async ()=>{
        const who = $("#whoSel").value;
        if(!who){ alert("请先选择操作人"); return; }
        const reason = prompt("撤销原因（会记入审计）");
        if(reason===null) return;
        try{
          const r = await jpost("/api/review/revoke", {id:b.dataset.rv, reason, employee_id:who});
          $("#reviewResult").innerHTML = `<div class="warnbar">${esc(r.impact.message)}</div>`;
          await loadReviews();
        }catch(e){ alert("撤销失败：" + e.message); }
      };
    });
  }catch(e){}
}

async function loadCases(){
  const d = await jget("/api/cases");
  S.cases = d.cases;
  $("#caseCount").textContent = `${d.cases.length} 张`;
  const cats = ["all","transport","lodging","meal"];
  const names = {all:"全部",transport:"交通",lodging:"住宿",meal:"餐饮"};
  $("#filters").innerHTML = cats.map(c=>`<button data-c="${c}" class="${S.cat===c?"on":""}">${names[c]}</button>`).join("");
  $("#filters").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.cat=b.dataset.c;loadCases();});
  const list = S.cases.filter(c=>S.cat==="all"||c.category===S.cat);
  $("#cases").innerHTML = list.map(c=>`<div class="case ${S.sel===c.id?"sel":""}" data-id="${c.id}">
    <div class="id">${c.id}</div>
    <div><div class="t">${esc(c.title)}</div>
    <div class="m">${c.category==="transport"?"交通":c.category==="lodging"?"住宿":"餐饮"} ${c.tags.filter(t=>t!=="clean"&&t!=="boundary"&&t!=="violation"&&t!=="combo"&&t!=="fault").slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div></div>
  </div>`).join("");
  $("#cases").querySelectorAll(".case").forEach(el=>el.onclick=()=>select(el.dataset.id));
}

async function select(id){
  S.sel = id; await loadCases();
  $("#runBtn").disabled = false;
  const c = await jget("/api/cases/"+id);
  $("#log").innerHTML = `<div class="empty">已选择 ${id} · ${esc(c.title)}<br><span class="muted">发票原文</span>
    <pre style="margin:12px 14px;text-align:left">${esc(c.invoice)}</pre></div>`;
  $("#result").innerHTML = `<div class="empty">按「开始审核」运行</div>`;
  renderSteps(null);
  $("#runState").textContent = "";
}

function renderSteps(activeStage){
  const doneSet = new Set();
  if(S.report) STAGE.forEach(s=>doneSet.add(s.k));
  $("#steps").innerHTML = STAGE.map((s,i)=>{
    let cls = "";
    if(S.report) cls = "done";
    else if(activeStage===s.k) cls = "active";
    return `<div class="step ${cls}"><span class="dot"></span>${s.n}</div>` + (i<STAGE.length-1?'<div class="sep"></div>':"");
  }).join("");
}

function addEvent(ev){
  const log = $("#log");
  if(S.evCount===0) log.innerHTML = "";
  S.evCount++;
  if(ev.stage && ev.stage!=="done") renderSteps(ev.stage);
  const div = document.createElement("div");
  div.className = "ev " + (ev.kind==="decision"&&ev.stage!=="done"?"finding":ev.kind);
  const hasData = ev.data && (ev.kind==="tool_result" || (ev.kind==="llm_result" && ev.stage==="extract" && ev.data.value!==undefined));
  div.innerHTML = `<div class="s">${ev.seq}</div><div class="k">${ev.stage}/${ev.kind}</div>
    <div><div class="t">${esc(ev.title)}</div>${ev.detail?`<div class="d">${esc(oneLine(ev.detail))}</div>`:""}
    ${hasData?`<pre>${esc(pretty(ev))}</pre>`:""}</div>`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function oneLine(s){ s=String(s); return s.length>400? s.slice(0,400)+"…" : s; }
function pretty(ev){
  if(ev.kind==="tool_result"){
    const t = ev.data;
    const o = {状态:t.status};
    if(t.detail) o.说明=t.detail;
    if(t.invoices) o.发票=t.invoices;
    if(t.companies) o.企业=t.companies;
    if(t.history) o.历史=t.history.slice(0,4).concat(t.history.length>4?[{note:`…共 ${t.history.length} 条`}]:[]);
    return JSON.stringify(o,null,2);
  }
  if(ev.kind==="llm_result" && ev.data.value!==undefined) return `value: "${ev.data.value}"\nconfidence: ${ev.data.conf}`;
  return JSON.stringify(ev.data,null,2);
}

async function run(){
  if(!S.sel) return;
  const faults = [];
  const f = $("#faultSel").value;
  if(f){ const [tool,mode] = f.split("="); faults.push({tool,mode}); }
  const disabled = [];
  if($("#offClaude").checked) disabled.push("claude");
  if($("#offDeepseek").checked) disabled.push("deepseek");
  if(disabled.length===2){ alert("两个模型都关掉就没有任何字段可用，请至少保留一个"); return; }

  $("#runBtn").disabled = true;
  $("#runState").innerHTML = '<span class="spin"></span>运行中';
  $("#result").innerHTML = '<div class="empty">审查进行中…</div>';
  S.evCount = 0; S.report = null;
  renderSteps("plan");
  if(S.es){ S.es.close(); S.es = null; }

  let sid;
  try{
    const r = await jpost("/api/audit", {case_id:S.sel, explain:$("#explainSel").value, disabled, faults});
    sid = r.session_id;
  }catch(e){
    $("#runState").textContent = "启动失败";
    $("#result").innerHTML = `<div class="warnbar">启动失败：${esc(e.message)}</div>`;
    $("#runBtn").disabled = false;
    return;
  }

  const es = new EventSource(`/api/audit/${sid}/events`);
  S.es = es;
  es.addEventListener("snapshot", e=>{
    const d = JSON.parse(e.data);
    S.evCount = 0;
    (d.events||[]).forEach(addEvent);
    if(d.done && d.report) showReport(d.report);
  });
  es.addEventListener("event", e=>{ addEvent(JSON.parse(e.data)); });
  es.addEventListener("report", e=>{ showReport(JSON.parse(e.data)); });
  es.addEventListener("done", e=>{
    es.close(); S.es = null;
    $("#runBtn").disabled = false;
    const d = JSON.parse(e.data);
    $("#runState").textContent = d.ok ? "完成" : "异常结束";
    const st = jget("/api/stats").then(x=>{ $("#m-cost").textContent = `本次运行 ${x.sessions||0} 单 · 成本约 $${(x.cost_usd||0).toFixed(5)}`; });
  });
  es.onerror = ()=>{
    // 浏览器会自动重连；重连后 snapshot 会把已发生的事件补齐。
    if(!S.report) $("#runState").innerHTML = '<span class="spin"></span>连接中断，重连中';
  };
}

function showReport(rep){
  S.report = rep;
  renderSteps(null);
  $("#elapsed").textContent = `${rep.elapsed_ms}ms · $${(rep.cost_usd||0).toFixed(5)}`;
  const r = rep.result;
  const rows = (rep.result.findings||[]).map(f=>`<div class="finding-row">
     <div class="h">${f.check_id} ${esc(f.rule_name)} · ${f.clause} → ${DEC[f.outcome]||f.outcome}</div>
     <div class="r">${esc(f.reason)}</div></div>`).join("");

  const skipped = Object.entries(r.skipped||{}).map(([k,v])=>`<div>${k} — ${esc(v)}</div>`).join("");
  const warns = (rep.warnings||[]).map(w=>`<div class="warnbar">${esc(w)}</div>`).join("");
  const fields = rep.extract ? Object.entries(rep.extract.fields||{}).map(([k,v])=>{
    const bad = (rep.extract.untrusted||[]).includes(k) || (rep.extract.low_confidence||[]).includes(k) || !v.value;
    // 置信度取自合并结果；服务端字段名为 confidence 或 conf，两者都兼容，避免显示 0.00 误导。
    const conf = Number(v.conf ?? v.confidence ?? 0);
    const label = {invoice_no:"发票号码",issue_date:"开票日期",total_amount:"价税合计",buyer_tax_id:"购买方税号",
      seller_tax_id:"销售方税号",buyer_name:"购买方",seller_name:"销售方",item_name:"发票项目"}[k]||k;
    return `<tr class="${bad?"bad":""}"><td>${label}</td><td class="v">${esc(v.value||"—")}</td><td>${conf.toFixed(2)}</td></tr>`;
  }).join("") : "";

  const tools = Object.entries(rep.tools||{}).map(([k,v])=>{
    const n = (v.invoices||[]).length + (v.companies||[]).length + (v.history||[]).length;
    const c = v.status==="ok" ? "" : "warnbar";
    return `<div class="${c}" style="margin:4px 0">${k}：${v.status}${v.detail?" · "+esc(v.detail):""} · ${n} 条</div>`;
  }).join("");

  $("#result").innerHTML = `
    <div class="verdict v-${r.decision}">
      <div class="big">${DEC[r.decision]||r.decision}</div>
      <div class="amt">核准 ${yuan(r.approved_fen)} · 申请 ${yuan(rep.claim_amount_fen)}</div>
      <div class="muted" style="margin-top:6px">${esc(rep.claim_no)} · 命中 ${(r.hits||[]).length} 项</div>
    </div>
    ${warns}
    ${rows || '<div class="muted">没有命中任何判定项</div>'}
    ${skipped?`<div class="skipped" style="margin-top:10px"><details><summary>未判定的项（${Object.keys(r.skipped).length}）</summary>${skipped}</details></div>`:""}
    <h3 style="font-size:12px;color:var(--faint);margin:14px 0 4px">审核意见</h3>
    <div class="op">${esc(rep.opinion)}</div>
    <h3 style="font-size:12px;color:var(--faint);margin:14px 0 4px">抽取字段与置信度</h3>
    <table class="fieldtable"><thead><tr><th>字段</th><th>合并值</th><th>置信度</th></tr></thead><tbody>${fields}</tbody></table>
    <h3 style="font-size:12px;color:var(--faint);margin:14px 0 4px">工具核验</h3>
    ${tools}
    <h3 style="font-size:12px;color:var(--faint);margin:14px 0 4px">人工复核</h3>
    <div class="impact">⚠️ 选择「通过」或「按核准金额通过」会把这张发票写入查重库，
      此后同一张发票会被判为<b>重复报销</b>。写错了可以撤销。</div>
    <input id="reviewNote" placeholder="复核意见（可选）">
    <div class="reviewbtns">
      <button data-d="approve">确认通过</button>
      <button data-d="approve_with_adjustment">按核准金额通过</button>
      <button data-d="need_more_info">退回补材料</button>
      <button data-d="reject">确认驳回</button>
    </div>
    <div id="reviewResult" style="margin-top:8px"></div>
    <div id="reviewList" style="margin-top:10px"></div>`;
  loadReviews();
  $("#result").querySelectorAll(".reviewbtns button").forEach(b=>{
    b.onclick = async ()=>{
      const who = $("#whoSel").value;
      if(!who){ alert("请先在工具栏选择操作人（工号）"); return; }
      try{
        const r = await jpost("/api/review", {case_id:S.sel, claim_no:rep.claim_no, decision:b.dataset.d,
          note:$("#reviewNote").value, employee_id:who, decision_before:rep.result.decision});
        b.textContent = "已记录 ✓";
        b.disabled = true;
        const imp = r.impact || {};
        $("#reviewResult").innerHTML = `<div class="warnbar">${esc(imp.message||"")}</div>`;
        await loadReviews();
      }catch(e){ alert("记录失败：" + e.message); }
    };
  });
}

$("#runBtn").onclick = run;
boot().catch(e=>{ document.body.insertAdjacentHTML("afterbegin", `<div class="warnbar" style="margin:10px">界面初始化失败：${esc(e.message)}</div>`); });
</script>
</body>
</html>
