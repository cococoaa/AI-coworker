<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>报销审核 AI 同事</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
  --fg:#e6e9ef; --dim:#9aa3b2; --faint:#6b7484;
  --ok:#3fb950; --warn:#d29922; --bad:#f85149; --info:#58a6ff; --purple:#a371f7;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.3px}
.badge{font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--dim)}
.badge.ok{color:var(--ok);border-color:#1d4025;background:#0d1f12}
.badge.bad{color:var(--bad);border-color:#5a2321;background:#22100f}
main{display:grid;grid-template-columns:clamp(280px,26vw,340px) minmax(320px,1fr) 330px;gap:12px;padding:12px;align-items:start}
@media (max-width:1280px){main{grid-template-columns:minmax(280px,340px) minmax(300px,1fr) 300px}}
@media (max-width:1000px){main{grid-template-columns:1fr}}
@media (max-width:700px){header{flex-wrap:wrap;gap:8px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
/* 左栏表单可能很长：限制高度并允许滚动，保证按钮始终可达 */
.panel.left{max-height:calc(100vh - 90px);display:flex;flex-direction:column}
.panel.left #uploadPane{overflow:auto;min-height:0;flex:1}
.panel.left > .tabs,.panel.left :is(#filters,#taskFilters){flex:none}
.panel.left > :is(#casePane,#taskPane){display:flex;flex-direction:column;flex:1 1 auto;min-height:0;overflow:hidden}
.panel.left :is(#cases,#tasks){flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-gutter:stable;scrollbar-color:#626e82 var(--panel)}
.panel.right{position:sticky;top:74px;max-height:calc(100vh - 90px);display:flex;flex-direction:column}
.panel.right .body{overflow:auto}
.panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--faint);margin:0;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.panel .body{padding:12px 14px}
.case{display:flex;gap:8px;padding:8px 10px;border-radius:7px;cursor:pointer;border:1px solid transparent}
.case:hover{background:var(--panel2)}
.case.sel{background:#1b2230;border-color:#2f4a6f}
.case .id{font-family:var(--mono);color:var(--dim);font-size:12px;min-width:28px}
.case .t{font-size:13px;line-height:1.35}
.case .m{font-size:11px;color:var(--faint);margin-top:2px}
.tag{display:inline-block;font-size:10px;padding:0 5px;border-radius:4px;background:#2a2f3a;color:var(--dim);margin-right:4px}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
.filters button{font-size:12px;padding:3px 9px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer}
.filters button.on{background:#233043;border-color:#33507a;color:#cfe3ff}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
button.primary{background:#1f6feb;border:none;color:#fff;padding:7px 16px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600}
button.primary:disabled{background:#2a3140;color:var(--faint);cursor:not-allowed}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);padding:6px 12px;border-radius:7px;cursor:pointer;font-size:12px}
button.ghost:hover{color:var(--fg);border-color:#3b4252}
label.chk{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--dim);cursor:pointer}
select{background:var(--panel2);border:1px solid var(--line);color:var(--fg);padding:5px 8px;border-radius:6px;font-size:12px}
.steps{display:flex;gap:0;padding:10px 14px;border-bottom:1px solid var(--line);overflow-x:auto}
.step{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);white-space:nowrap}
.step .dot{width:7px;height:7px;border-radius:50%;background:#3b4252}
.step.active{color:var(--info)}
.step.active .dot{background:var(--info);box-shadow:0 0 0 3px #58a6ff22}
.step.done{color:var(--ok)}
.step.done .dot{background:var(--ok)}
.step .sep{width:26px;height:1px;background:var(--line);margin:0 8px}
#log{height:calc(100vh - 250px);min-height:320px;overflow:auto;padding:8px 0;font-size:13px}
.ev{display:grid;grid-template-columns:52px 74px minmax(0,1fr);gap:8px;padding:5px 14px;border-left:2px solid transparent}
.ev:hover{background:#1a1e26}
.ev .s{font-family:var(--mono);color:#4b5361;font-size:11px;text-align:right}
.ev .k{font-size:10px;padding:1px 0;letter-spacing:.4px;color:var(--faint)}
.ev .t{line-height:1.45}
.ev .d{color:var(--dim);font-size:12px;margin-top:2px;word-break:break-word}
.ev.llm_call{border-left-color:var(--purple)}
.ev.llm_call .k{color:var(--purple)}
.ev.llm_result .k{color:#8b949e}
.ev.tool_call{border-left-color:var(--info)}
.ev.tool_call .k{color:var(--info)}
.ev.tool_result{border-left-color:#2f6f9f}
.ev.tool_result .k{color:#6fa8dc}
.ev.finding{border-left-color:var(--warn)}
.ev.finding .k{color:var(--warn)}
.ev.decision{border-left-color:var(--ok);background:#0f1a12}
.ev.decision .k{color:var(--ok)}
.ev.warn{border-left-color:#6b3030;background:#1a1213}
.ev.warn .k{color:#d97a72}
.ev.fail{border-left-color:var(--bad);background:#1a1012}
.ev.fail .k{color:var(--bad)}
pre{margin:6px 0 0;padding:8px 10px;background:#0b0d11;border:1px solid var(--line);border-radius:6px;font-family:var(--mono);font-size:11.5px;line-height:1.5;overflow:auto;max-height:260px;color:#c3cad6}
.verdict{border-radius:10px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.verdict .big{font-size:22px;font-weight:700;letter-spacing:.5px}
.verdict .amt{font-family:var(--mono);font-size:15px;margin-top:4px;color:var(--dim)}
.v-approve{border-color:#1d4025;background:#0d1f12}
.v-approve .big{color:var(--ok)}
.v-approve_with_adjustment{border-color:#4a3b12;background:#1e1a0c}
.v-approve_with_adjustment .big{color:var(--warn)}
.v-manual_review{border-color:#3a3f52;background:#171b24}
.v-manual_review .big{color:#c9d1d9}
.v-need_more_info{border-color:#4a3b12;background:#1e1a0c}
.v-need_more_info .big{color:var(--warn)}
.v-reject{border-color:#5a2321;background:#22100f}
.v-reject .big{color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px;margin:6px 0}
.kv .k{color:var(--faint)}
.kv .v{color:var(--fg);word-break:break-all}
.finding-row{border-left:3px solid var(--warn);padding:6px 10px;margin:6px 0;background:#1a1810;border-radius:0 6px 6px 0}
.finding-row .h{font-size:12px;color:var(--warn);font-weight:600}
.finding-row .r{font-size:12px;color:var(--dim);margin-top:3px}
.op{white-space:pre-wrap;font-size:13px;line-height:1.7;background:#0b0d11;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.fieldtable{width:100%;border-collapse:collapse;font-size:12px}
.fieldtable th{text-align:left;color:var(--faint);font-weight:500;padding:3px 6px;border-bottom:1px solid var(--line)}
.fieldtable td{padding:3px 6px;border-bottom:1px solid #1d222b;font-family:var(--mono)}
.fieldtable tr.bad td{background:#22100f}
.fieldtable tr.bad td.v{color:#ff9b94}
.skipped{font-size:12px;color:var(--dim)}
.skipped details{margin:4px 0}
.skipped summary{cursor:pointer;color:var(--faint)}
.muted{color:var(--faint);font-size:12px}
.empty{color:var(--faint);font-size:13px;padding:20px;text-align:center}
.spin{display:inline-block;width:10px;height:10px;border:2px solid #58a6ff44;border-top-color:var(--info);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.impact{background:#1e1a0c;border:1px solid #4a3b12;color:#e3c07b;font-size:11.5px;
  padding:6px 9px;border-radius:6px;margin:2px 0 8px;line-height:1.6}
.rvitem{font-size:11.5px;border-left:2px solid var(--line);padding:4px 8px;margin:4px 0;color:var(--dim)}
.rvitem.rev{opacity:.55;border-left-color:#6b3030}
.rvitem .who{color:var(--fg)}
.rvitem .what{color:var(--warn)}
.rvitem button{font-size:10.5px;padding:1px 7px;border-radius:4px;border:1px solid var(--line);
  background:transparent;color:var(--dim);cursor:pointer;margin-left:6px}
.warnbar{background:#1e1a0c;border:1px solid #4a3b12;color:#e3c07b;font-size:12px;padding:6px 10px;border-radius:6px;margin:6px 0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.split .panel{background:var(--panel2)}
.split h3{font-size:11px;color:var(--faint);margin:0 0 6px;text-transform:uppercase;letter-spacing:.5px}
#reviewNote{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:6px 8px;font-size:12px;font-family:inherit}
.reviewbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.reviewbtns button{flex:1;font-size:12px;padding:6px 4px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);cursor:pointer}
.reviewbtns button:hover{color:var(--fg);border-color:#3b4252}
/* 任务队列：财务最先要看的是"哪些单卡住了"，不是"有哪些单据" */
.tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--line)}
.tabs button{flex:1 0 auto;min-width:72px;background:transparent;border:none;border-bottom:2px solid transparent;
  color:var(--faint);font-size:12px;padding:9px 6px;cursor:pointer;font-family:inherit;white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:#1f6feb}
.tabs .n{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:#2a2f3a;
  color:var(--dim);font-size:10px;margin-left:4px}
.tabs button.on .n{background:#1f3346;color:#a8c7fa}
.upform{padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;align-items:start}
.upform .full{grid-column:1 / -1}
.upform .actions{grid-column:1 / -1;position:sticky;bottom:0;background:var(--panel);
  padding:8px 0 2px;display:flex;gap:8px;align-items:center}
.upform .f{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--faint)}
.upform .f input,.upform .f select{background:var(--panel2);border:1px solid var(--line);
  color:var(--fg);border-radius:5px;padding:5px 7px;font-size:12px;font-family:inherit}
.upform .f input[type=file]{padding:3px;font-size:11px}
.upform .f input,.upform .f select{min-width:0}
.upform .upmore{border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.upmore summary{cursor:pointer;color:var(--dim);font-size:12px}
.upmore-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-top:10px}
.upform #upPreview{font-size:12px;line-height:1.6}
.uphint{grid-column:1 / -1;font-size:11.5px;color:var(--dim);line-height:1.6;padding:8px 10px;
  background:var(--panel2);border:1px solid var(--line);border-radius:6px}
.upok{background:#0d1f12;border:1px solid #1d4025;color:#7ee787;font-size:12px;
  padding:8px 10px;border-radius:6px;line-height:1.6}
.upbad{background:#22100f;border:1px solid #5a2321;color:#ff9b94;font-size:12px;
  padding:8px 10px;border-radius:6px;line-height:1.6}
.taskitem{padding:8px 10px;border-radius:7px;cursor:pointer;border:1px solid transparent;
  border-left:3px solid var(--line)}
.taskitem:hover{background:var(--panel2)}
.taskitem.sel{background:#1b2230;border-color:#2f4a6f;border-left-color:#1f6feb}
.taskitem .top{display:flex;gap:6px;align-items:center;font-size:12px}
.taskitem .tid{font-family:var(--mono);color:var(--faint);font-size:11px}
.taskitem .st{font-size:10px;padding:1px 6px;border-radius:9px;border:1px solid var(--line);color:var(--dim)}
.taskitem .st.need_more{color:var(--warn);border-color:#4a3b12;background:#1e1a0c}
.taskitem .st.need_manual{color:#c9d1d9;border-color:#3a3f52;background:#171b24}
.taskitem .st.approved{color:var(--ok);border-color:#1d4025;background:#0d1f12}
.taskitem .st.rejected{color:var(--bad);border-color:#5a2321;background:#22100f}
.taskitem .st.auditing{color:var(--info);border-color:#243b5a;background:#0d1622}
.taskitem .st.withdrawn{color:var(--faint)}
.taskitem .sub{font-size:11px;color:var(--faint);margin-top:3px}
.taskitem .who{color:#a8c7fa}
.taskitem .miss{font-size:11px;color:var(--warn);margin-top:3px}
.gap{padding:12px 14px;color:var(--faint);font-size:12px;text-align:center}
/* 溯源表 */
.tracetable{width:100%;border-collapse:collapse;font-size:11.5px}
.tracetable th{text-align:left;color:var(--faint);font-weight:500;padding:3px 6px;border-bottom:1px solid var(--line)}
.tracetable td{padding:4px 6px;border-bottom:1px solid #1d222b;vertical-align:top}
.tracetable td.f{color:var(--dim);white-space:nowrap}
.tracetable td.v{font-family:var(--mono);word-break:break-all}
.tracetable .q{color:var(--faint);font-size:11px;margin-top:2px;line-height:1.45}
.tracetable tr.nf{background:#1a1810}
.tracetable tr.nf td.v{color:#ffd98a}
.tracetable tr.sup{background:#1a1610}
.srcbadge{font-size:10px;padding:0 5px;border-radius:4px;white-space:nowrap}
.srcbadge.invoice{background:#0d1f12;color:#7ee787;border:1px solid #1d4025}
.srcbadge.support{background:#1e1a0c;color:#e3c07b;border:1px solid #4a3b12}
.srcbadge.none{background:#22100f;color:#ff9b94;border:1px solid #5a2321}
.srcbadge.empty{background:#1a1e26;color:var(--faint);border:1px solid var(--line)}
[hidden]{display:none!important}
.contest{max-width:1140px;margin:16px auto;padding:0 16px;display:grid;gap:14px}
.contest .body{padding:16px}
.demo-results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.demo-result{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px}
.demo-result p{margin:6px 0}
.demo-content{display:block;width:100%;min-height:150px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px;margin:10px 0;font:inherit}
@media(max-width:620px){.demo-results{grid-template-columns:1fr}}
.workbench-meta{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px}
.conversation{max-width:820px;margin:0 auto;padding:24px 18px;min-height:calc(100vh - 65px);display:flex;flex-direction:column}
.chat-log{flex:1;min-height:240px;display:flex;flex-direction:column;gap:18px;padding:12px 0 24px}
.chat-turn{display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.chat-turn.user{align-items:flex-end}
.chat-speaker{font-size:12px;color:var(--dim)}
.chat-message{max-width:min(660px,92%);white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.7}
.chat-turn.user .chat-message{background:var(--panel2);border:1px solid var(--line);padding:7px 13px;border-radius:12px}
.chat-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chat-composer{position:sticky;bottom:0;background:var(--bg);padding:10px 0 4px}
.chat-input-row{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.chat-input-row input{flex:1;min-width:80px;background:transparent;color:var(--fg);font:inherit;border:0;padding:8px}
.chat-input-row input:focus-visible{outline:2px solid var(--info);border-radius:6px}
.chat-input-row button{white-space:nowrap}
.chat-attachment{margin-bottom:10px}
.chat-attachment summary{padding:9px 12px;cursor:pointer}
.chat-case-picker{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 9px}
.chat-case-picker select{max-width:min(100%,420px);flex:1}
.sup-editor{display:grid;gap:8px;margin:8px 0}
.sup-editor label{display:grid;gap:3px;color:var(--fg);font-size:12px}
.sup-editor small{color:var(--dim);font-size:11px}
.sup-editor :is(input,textarea,select){width:100%;min-width:0;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 7px;font:inherit}
.sup-paste summary{cursor:pointer;color:var(--info);font-size:12px;margin-bottom:5px}
.sup-feedback{color:var(--warn);font-size:12px;margin-top:4px}
.review-heading{font-size:12px;color:var(--faint);margin:8px 0}
.review-controls{display:grid;gap:7px;margin:8px 0}
.review-search{width:100%;min-width:0;color:var(--fg);background:var(--panel2);border:1px solid var(--line);padding:6px 8px;border-radius:6px;font:inherit}
.review-top,.review-pager{display:flex;justify-content:space-between;align-items:center;gap:8px}
.review-pager{margin-top:8px;font-size:12px;color:var(--dim)}
.review-note,.review-revoked{margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.review-revoked{color:var(--bad)}
#reviewArchive{width:min(680px,calc(100% - 32px));max-height:calc(100vh - 48px);overflow:auto;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:16px}
#reviewArchive::backdrop{background:#0009}
#reviewArchive h2{font-size:16px;margin:0}
</style>
</head>
<body>
<header>
  <h1>报销审核 · AI 同事</h1>
  <button id="contestToggle" class="ghost" aria-controls="contestPane" aria-expanded="false">比赛演示</button>
  <button id="workbenchToggle" class="ghost" aria-controls="businessPane" aria-expanded="false">审核工作台</button>
  <button id="reviewArchiveToggle" class="ghost" aria-haspopup="dialog">复核记录</button>
</header>

<dialog id="reviewArchive" aria-labelledby="reviewArchiveTitle">
  <div class="review-top"><h2 id="reviewArchiveTitle">复核记录</h2><form method="dialog"><button class="ghost">关闭</button></form></div>
  <div id="reviewArchiveList"></div>
</dialog>

<section id="conversation" class="conversation" aria-label="报销同事对话">
  <div id="chatLog" class="chat-log" role="log" aria-live="polite">
    <div class="chat-turn">
      <span class="chat-speaker">报销同事</span>
      <div class="chat-message">你好。有发票就发给我，也可以聊点别的。</div>
    </div>
  </div>
  <div class="chat-composer">
    <details id="chatAttachment" class="panel chat-attachment" hidden><summary>填写报销信息并送审</summary></details>
    <div id="chatCasePicker" class="chat-case-picker" hidden>
      <select id="chatCase" aria-label="选择已有单据"></select>
      <button type="button" class="primary" id="chatAuditExisting">送审</button>
    </div>
    <form id="chatForm" class="chat-input-row">
      <button type="button" class="ghost" id="chatAttach">发票送审</button>
      <input id="chatInput" aria-label="消息" maxlength="1600" autocomplete="off" placeholder="发消息…">
      <button type="submit" class="primary" id="chatSend">发送</button>
    </form>
    <button type="button" class="ghost" id="chatChoose" style="margin-top:7px">选择已有单据</button>
  </div>
</section>

<div class="workbench-meta" id="workbenchMeta" hidden>
  <span id="m-rules" class="badge"></span>
  <span id="m-ds" class="badge"></span>
  <span id="m-cl" class="badge"></span>
  <span id="m-tools" class="badge"></span>
  <span style="flex:1"></span>
  <span id="m-prov" class="badge" title=""></span>
  <span id="m-quota" class="badge" title="本周 AI 用量"></span>
  <span id="m-cost" class="badge"></span>
</div>

<main id="businessPane" hidden>
  <section class="panel left">
    <div class="tabs">
      <button id="tabTasks" class="on">进行中 <span class="n" id="taskCount">0</span></button>
      <button id="tabCases">全部单据 <span class="n" id="caseCount">0</span></button>
      <button id="tabUpload">上传票据</button>
    </div>
    <div id="taskPane">
      <div class="filters" id="taskFilters"></div>
      <div id="tasks" role="region" aria-label="任务列表" tabindex="0"></div>
    </div>

合计:¥553.00</textarea>

<script>
const $ = s => document.querySelector(s);
const S = {cases:[], cat:"all", sel:null, ses:null, es:null, evCount:0, report:null,
  tasks:[], tab:"tasks", taskFilter:"approved", taskID:null, task:null};

const DEC = {approve:"通过",approve_with_adjustment:"调整后通过",manual_review:"转人工复核",need_more_info:"退回补材料",reject:"驳回"};
const STAGE = [{k:"plan",n:"确定范围"},{k:"extract",n:"双模型抽取"},{k:"tools",n:"工具核验"},{k:"aggregate",n:"规则判定"},{k:"explain",n:"审核意见"}];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const yuan = f => "¥" + (f/100).toFixed(2);

async function jget(u){ const r = await fetch(u); if(!r.ok) throw new Error(await r.text()); return r.json(); }
async function jpost(u, b){ const r = await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}); if(!r.ok) throw new Error(await r.text()); return r.json(); }

let contestTaskID = null;
const contestButtons = [$("#contestCompare"), $("#contestStart"), $("#contestResume")];
$("#contestToggle").onclick = () => {
  const open = $("#contestPane").hidden;
  $("#contestPane").hidden = !open;
  $("#conversation").hidden = open;
  setWorkbench(false);
  $("#contestToggle").setAttribute("aria-expanded", String(open));
  $("#contestToggle").textContent = open ? "返回对话" : "比赛演示";
};

function contestCard(title, audit){
  const r = audit.result;
  const findings = (r.findings || []).map(f => `<p><b>${esc(f.check_id)} ${esc(f.clause)}</b> · ${esc(f.reason)}</p>`).join("");
  return `<article class="demo-result">
    <strong>${esc(title)}</strong>
    <p class="muted">${esc(audit.version)} · 报销期限 ${audit.deadline_days} 天</p>
    <p><b>${esc(DEC[r.decision] || r.decision)}</b> · 核准 ${yuan(r.approved_fen)}</p>
    ${findings}
  </article>`;
}

async function runContest(action, body, show){
  contestButtons.forEach(button => button.disabled = true);
  $("#contestStatus").textContent = "审核中…";
  try {
    const response = await fetch("/api/contest/" + action, {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)
    });
    const data = await response.json().catch(() => ({}));
    if(!response.ok) throw new Error(data.error || "比赛演示暂不可用");
    show(data);
    $("#contestStatus").textContent = "";
  } catch(e) {
    $("#contestStatus").textContent = e.message;
  } finally {
    contestButtons.forEach(button => button.disabled = false);
  }
}

$("#contestCompare").onclick = () => runContest("compare", {}, data => {
  $("#contestComparison").innerHTML = contestCard("默认制度", data.default) + contestCard("市政国企示例", data.municipal);
});
$("#contestStart").onclick = () => runContest("start", {}, data => {
  contestTaskID = data.task.id;
  $("#contestRounds").innerHTML = contestCard("第 1 轮 · 首次审核", data.audit);
  $("#contestContent").value = $("#contestContent").defaultValue;
  $("#contestSupplement").hidden = data.task.state !== "need_more";
});
$("#contestResume").onclick = () => runContest("resume", {
  task_id: contestTaskID, content: $("#contestContent").value
}, data => {
  const rounds = $("#contestRounds");
  const title = `第 ${data.task.runs.length} 轮 · 补件后续审`;
  if(rounds.children.length > 1) rounds.lastElementChild.remove();
  rounds.insertAdjacentHTML("beforeend", contestCard(title, data.audit));
  $("#contestSupplement").hidden = data.task.state !== "need_more";
});

async function boot(){
  const meta = await jget("/api/meta");
  S.toolDataIsMock = meta.provenance?.tool_backend === "mock";
  $("#m-rules").textContent = `${meta.rules.policy} · ${meta.rules.version} · 报销期限 ${meta.rules.deadline_days} 天`;
  const dm = meta.models.find(m=>m.provider==="deepseek"), cm = meta.models.find(m=>m.provider==="claude");
  $("#m-ds").textContent = `DeepSeek ${dm.key_ready?"就绪":"未配置密钥"}`;
  $("#m-ds").className = "badge " + (dm.key_ready?"ok":"");
  $("#m-cl").textContent = `Claude ${cm.key_ready?"就绪":"未配置密钥"}`;
  $("#m-cl").className = "badge " + (cm.key_ready?"ok":"");
  $("#m-tools").textContent = `MCP 工具 ${meta.tools.mode==="remote"?"远程":"进程内"} · 3 个`;
  // 两个"真实"分开说：模型可以真跑，核验数据仍是 mock。避免"真实模型"被读成全链路真实。
  if(meta.provenance){
    const pv = meta.provenance;
    const el = $("#m-prov");
    el.textContent = pv.model_live ? "模型：真实调用 ／ 票据：合成 ／ 核验：mock"
                                  : pv.synthetic_enabled ? "票据与抽取：合成 ／ MCP 数据：模拟" : "模型：未配置 ／ MCP 数据：模拟";
    el.title = pv.note + "。本系统的结论只代表对合成数据的判定，不代表真实票据识别能力。";
  }
  if(!dm.key_ready && !cm.key_ready){
    $("#m-ds").title = "两种模式：配了密钥走真实模型；未配置时按启动参数决定回放录制或合成演示";
    const tip = document.createElement("span");
    tip.className = "badge";
    tip.textContent = "无密钥：见右侧数据来源提示";
    $("#m-cl").after(tip);
  }
  const st = await jget("/api/stats");
  $("#m-cost").textContent = `本次运行 ${st.sessions||0} 单 · 成本约 $${(st.cost_usd||0).toFixed(5)}`;
  renderSteps(null);
  await loadPeople();
  await loadQuota();
  await loadCases();
  await loadTasks();
  const initialCase = new URLSearchParams(location.search).get("case");
  if(S.cases.some(c=>c.id===initialCase)){
    switchTab("cases");
    await select(initialCase);
  }
}

// ---- 任务队列 ----
// 任务按状态筛选，原始单据仍在「全部单据」页签。

async function loadTasks(focusID){
  let d;
  try{ d = await jget("/api/tasks"); }
  catch(e){ $("#tasks").innerHTML = `<div class="gap">任务库不可用：${esc(e.message)}</div>`; return; }
  if(!d.enabled){
    $("#tasks").innerHTML = '<div class="gap">未启用任务库（启动时 -task-file 为空）</div>';
    return;
  }
  S.tasks = d.tasks || [];
  const active = S.tasks.filter(t=>!["approved","rejected","withdrawn"].includes(t.state));
  $("#taskCount").textContent = active.length;
  const filters = [
    ["approved", "已通过", "暂无已通过的单据"],
    ["need_more", "待补材料", "暂无待补材料的单据"],
    ["need_manual", "待复核", "暂无待复核的单据"],
    ["rejected", "已驳回", "暂无已驳回的单据"],
    ["all", "全部", "暂无审核任务"],
  ];
  const focused = S.tasks.find(t=>t.id===focusID);
  if(focused && S.taskFilter!=="all" && S.taskFilter!==focused.state){
    S.taskFilter = filters.some(([key])=>key===focused.state) ? focused.state : "all";
  }
  const byFilter = new Map(filters.map(([key])=>[key,key==="all"?S.tasks:S.tasks.filter(t=>t.state===key)]));
  $("#taskFilters").innerHTML = filters.map(([key,label])=>
    `<button data-f="${key}" class="${S.taskFilter===key?"on":""}" aria-pressed="${String(S.taskFilter===key)}">${label} ${byFilter.get(key).length}</button>`
  ).join("");
  $("#taskFilters").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.taskFilter=b.dataset.f;loadTasks();});

  const list = byFilter.get(S.taskFilter) || S.tasks;
  if(list.length===0){
    const [, , empty] = filters.find(([key])=>key===S.taskFilter) || filters[filters.length-1];
    $("#tasks").innerHTML = `<div class="gap">${empty}</div>`;
    return;
  }
  $("#tasks").innerHTML = list.map(t=>{
    const miss = (t.outstanding_labels||[]).join("、");
    return `<div class="taskitem ${S.taskID===t.id?"sel":""}" data-t="${esc(t.id)}">
      <div class="top">
        <span class="st ${t.state}">${esc(t.state_label)}</span>
        <span class="tid">${esc(t.id)}</span>
        <span style="flex:1"></span>
        <span class="tid">${esc(t.case_id)}</span>
      </div>
      <div class="sub">${["approved","rejected","withdrawn"].includes(t.state)
        ? esc(t.claim_no||t.case_id)
        : `卡在 <span class="who">${esc(t.waiting_on)}</span> · ${t.waiting_days>0?`已 ${t.waiting_days} 天`:"今天"}`} · 第 ${t.rounds||0} 轮</div>
      ${miss?`<div class="miss">缺：${esc(miss)}</div>`:""}
    </div>`;
  }).join("");
  $("#tasks").querySelectorAll(".taskitem").forEach(el=>el.onclick=()=>openTask(el.dataset.t));
}

// openTask 展开一张任务：补件清单、材料版本、续审计划、事件轨迹。
async function openTask(id){
  S.taskID = id;
  await loadTasks(id);
  let d;
  try{ d = await jget("/api/tasks/"+id); }
  catch(e){ $("#result").innerHTML = `<div class="warnbar">读取任务失败：${esc(e.message)}</div>`; return; }
  const t = d.task; S.task = t;
  const c = S.cases.find(x=>x.id===t.case_id);
  if(c) S.sel = t.case_id;

  const stTxt = t.state==="need_more" ? "退回补材料" : t.state==="need_manual" ? "转人工复核"
    : t.state==="pending" ? "待审核" : t.state==="approved" ? (t.approval_review_id?"人工复核通过":"初审通过") : t.state==="rejected" ? "已驳回" : "已撤销";
  const kindName = {absent:"原件未填写", unreadable:"无法辨认", ambiguous:"两模型不一致", missing_attachment:"整份缺失", explanation:"需补充说明"};
  const items = (t.missing||[]).map(m=>`<div class="finding-row" style="${m.resolved?"opacity:.5;border-left-color:var(--ok)":""}">
    <div class="h">${esc(m.label)} · ${kindName[m.kind]||m.kind}${m.resolved?' <span style="color:var(--ok)">已补交</span>':""}</div>
    <div class="r">${esc(m.key==="claim_info" && d.claim_fields?.length ? "请补齐下面列出的报销信息。" : m.reason)}${m.clause?`（依据 ${esc(m.clause)}）`:""}</div>
    ${m.resolved?"":`${supplementEditor(m,d.category,d.claim_fields)}
      <button class="ghost supBtn" data-k="${esc(m.key)}" data-l="${esc(m.label)}">提交${esc(m.label)}</button>
      <div class="sup-feedback" role="status"></div>`}
  </div>`).join("");

  const atts = (t.attachments||[]).map(a=>`<div class="rvitem">v${a.version} · ${esc(a.name)}
    · ${esc(a.by||"")} · ${esc((a.at||"").slice(0,16).replace("T"," "))}
    ${a.note?`· ${esc(a.note)}`:""}
    ${["late_explanation","finance_request"].includes(a.kind)&&a.content?`<details><summary>查看说明正文</summary><div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(a.content)}</div></details>`:""}</div>`).join("");

  const runs = (t.runs||[]).map(r=>`<div class="rvitem">第 ${r.round} 轮 · ${DEC[r.decision]||r.decision}
    · 核准 ${yuan(r.approved_fen)} · ${r.elapsed_ms||0}ms · $${(r.cost_usd||0).toFixed(5)}
    ${r.trigger?`· ${r.trigger==="reaudit"?"续审":"首次"}`:""}</div>`).join("");

  const evs = (t.events||[]).map(e=>`<div class="rvitem">${esc((e.at||"").slice(0,16).replace("T"," "))}
    · ${esc(e.detail)}${e.by?` <span class="who">${esc(e.by)}</span>`:""}</div>`).join("");

  const canReaudit = t.state==="pending" && !(t.missing||[]).some(m=>!m.resolved);

  $("#result").innerHTML = `
    <div class="verdict v-${t.state==="approved"?"approve":t.state==="rejected"?"reject":t.state==="need_more"?"need_more_info":"manual_review"}">
      <div class="big">${stTxt}</div>
      <div class="amt">${esc(t.claim_no)} · ${esc(t.id)} · 第 ${(t.runs||[]).length} 轮</div>
      <div class="muted" style="margin-top:6px">卡在：<b style="color:#a8c7fa">${esc(d.waiting_on)}</b></div>
    </div>
    <h3 style="font-size:12px;color:var(--faint);margin:14px 0 4px">补件清单（${(t.missing||[]).filter(m=>!m.resolved).length}/${(t.missing||[]).length} 项待补）</h3>
    ${items || (t.state==="need_more" ? '<div class="muted">这次退回没有列出具体材料。请查看审核意见，或请财务补充退回要求。</div>' : '<div class="muted">没有缺件</div>')}
    ${canReaudit?`<button class="primary" id="reauditBtn" style="margin-top:10px;width:100%">
      ${(t.runs||[]).length>0?"续审":"开始审核"}</button>`:
      t.state==="need_more"&&(t.missing||[]).some(m=>!m.resolved)?`<div class="warnbar">补齐清单里的材料后，可以续审。</div>`:""}
    <div id="taskMsg" style="margin-top:8px"></div>
    ${atts?`<h3 style="font-size:12px;color:var(--faint);margin:14px 0 4px">材料版本</h3>${atts}`:""}
    ${runs?`<h3 style="font-size:12px;color:var(--faint);margin:14px 0 4px">审核批次</h3>${runs}`:""}
    ${evs?`<h3 style="font-size:12px;color:var(--faint);margin:14px 0 4px">任务轨迹</h3>${evs}`:""}
    <div style="margin-top:10px"><button class="ghost" id="taskBackBtn">← 回到任务列表</button></div>`;

  $("#taskBackBtn").onclick = ()=>{ S.taskID=null; S.task=null; loadTasks(); $("#result").innerHTML='<div class="empty">还没有结果</div>'; };
  if($("#reauditBtn")) $("#reauditBtn").onclick = ()=>startAudit({task_id:t.id});
  $("#result").querySelectorAll(".supBtn").forEach(b=>{
    b.onclick = ()=>submitSupport(t.id, b.dataset.k, b.dataset.l, b);
  });
}

// submitSupport 提交一项补交材料，然后刷新任务。
async function submitSupport(taskID, key, label, btn){
  const item = btn.closest(".finding-row");
  const status = item.querySelector(".sup-feedback");
  let content;
  try{
    content = readSupplement(item.querySelector(".sup-editor"));
  }catch(e){
    status.textContent = e.message;
    return;
  }
  const who = $("#whoSel").value;
  btn.disabled = true;
  status.textContent = "正在提交…";
  try{
    const r = await jpost(`/api/tasks/${taskID}/resubmit`, {
      kind:key, name:label, note:"界面补交", content, employee_id:who});
    // 幂等命中也算成功，但要说清楚没有新增版本。
    const msg = r.duplicate ? "这份材料之前已经提交过，本次没有重复登记。" : "已登记，材料版本 +1。";
    const next = (r.next||{}).message||"";
    await loadTasks();
    await openTask(taskID);
    $("#taskMsg").innerHTML = `<div class="warnbar">${esc(msg)} ${esc(next)}</div>`;
  }catch(e){
    btn.disabled = false;
    try{ status.textContent = JSON.parse(e.message).error || "提交失败，请重试。"; }
    catch{ status.textContent = "提交失败，请重试。"; }
  }
}

// loadPeople 拉工号名单，填充"当前操作人"；没有名单时禁用复核并说明原因。
async function loadPeople(){
  try{
    const d = await jget("/api/people");
    const sel = $("#whoSel");
    if(!d.people || d.people.length===0){
      sel.innerHTML = '<option value="">（未配置人员名单）</option>';
      sel.disabled = true;
      return;
    }
    const bound = d.people.find(p=>p.employee_id===d.operator_id);
    const choices = d.can_choose_reviewer ? d.people : (bound ? [bound] : []);
    sel.innerHTML = '<option value="">' + (d.can_choose_reviewer ? '选择演示复核人' : '未绑定复核人') + '</option>' +
      choices.map(p=>`<option value="${esc(p.employee_id)}" ${p.can_review?"":"disabled"}>
        ${esc(p.employee_id)} ${esc(p.name)}${p.can_review?"":"（无复核权限）"}</option>`).join("");
    if(bound) sel.value = bound.employee_id;
    sel.disabled = !d.can_choose_reviewer;
    sel.title = d.can_choose_reviewer ? "本机演示复核人" : "复核记录使用已绑定身份";
  }catch(e){ /* 名单接口失败不影响主流程 */ }
}

function renderSteps(activeStage){
  const doneSet = new Set();
  if(S.report) STAGE.forEach(s=>doneSet.add(s.k));
  $("#steps").innerHTML = STAGE.map((s,i)=>{
    let cls = "";
    if(S.report) cls = "done";
    else if(activeStage===s.k) cls = "active";
    return `<div class="step ${cls}"><span class="dot"></span>${s.n}</div>` + (i<STAGE.length-1?'<div class="sep"></div>':"");
  }).join("");
}

function addEvent(ev){
  const log = $("#log");
  if(S.evCount===0) log.innerHTML = "";
  S.evCount++;
  if(ev.stage && ev.stage!=="done") renderSteps(ev.stage);
  const div = document.createElement("div");
  div.className = "ev " + (ev.kind==="decision"&&ev.stage!=="done"?"finding":ev.kind);
  const hasData = ev.data && (ev.kind==="tool_result" || (ev.kind==="llm_result" && ev.stage==="extract" && ev.data.value!==undefined));
  div.innerHTML = `<div class="s">${ev.seq}</div><div class="k">${ev.stage}/${ev.kind}</div>
    <div><div class="t">${esc(ev.title)}</div>${ev.detail?`<div class="d">${esc(oneLine(ev.detail))}</div>`:""}
    ${hasData?`<pre>${esc(pretty(ev))}</pre>`:""}</div>`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function oneLine(s){ s=String(s); return s.length>400? s.slice(0,400)+"…" : s; }
function pretty(ev){
  if(ev.kind==="tool_result"){
    const t = readToolOutcome(ev.data);
    const o = {状态:toolStatusText(t)};
    if(t.reason) o.说明=t.reason;
    if(t.invoices.length) o.发票=t.invoices;
    if(t.companies.length) o.企业=t.companies;
    if(t.history.length) o.历史=t.history.slice(0,4).concat(t.history.length>4?[{note:`…共 ${t.history.length} 条`}]:[]);
    return JSON.stringify(o,null,2);
  }
  if(ev.kind==="llm_result" && ev.data.value!==undefined) return `value: "${ev.data.value}"\nconfidence: ${ev.data.conf}`;
  return JSON.stringify(ev.data,null,2);
}

// startAudit 启动一次审核。opts.task_id 非空表示这是续审（在已有任务上再跑一轮）。
// 首次审核与续审走同一条事件流、同一个报告渲染，区别只在服务端：续审带重查计划。
async function startAudit(opts){
  opts = opts || {};
  if(S.running || (!opts.task_id && !S.sel)) return;
  const faults = [];
  const f = $("#faultSel").value;
  if(f){ const [tool,mode] = f.split("="); faults.push({tool,mode}); }
  const disabled = [];
  if($("#offClaude").checked) disabled.push("claude");
  if($("#offDeepseek").checked) disabled.push("deepseek");
  if(disabled.length===2){ alert("两个模型都关掉就没有任何字段可用，请至少保留一个"); return; }

  const reviewCaseID = S.sel;
  const chatTurn = beginAuditTurn(opts.label || reviewCaseID || "报销单据", !!opts.task_id);
  S.running = true;
  $("#runBtn").disabled = true;
  $("#runState").innerHTML = '<span class="spin"></span>' + (opts.task_id ? "续审中" : "运行中");
  // 任务视图里点"续审"时，右栏还是任务详情，直接覆盖会丢上下文；
  // 所以这里只把运行状态放到左栏日志区顶部。
  if(!opts.task_id) $("#result").innerHTML = '<div class="empty">审查进行中…</div>';
  S.evCount = 0; S.report = null;
  renderSteps("plan");
  if(S.es){ S.es.close(); S.es = null; }

  let sid;
  try{
    const url = opts.task_id ? `/api/tasks/${opts.task_id}/reaudit` : "/api/audit";
    const body = opts.task_id
      ? {explain:$("#explainSel").value, disabled, faults}
      : {case_id:S.sel, explain:$("#explainSel").value, disabled, faults};
    const r = await jpost(url, body);
    sid = r.session_id;
    S.sid = sid;
    S.lastTaskID = opts.task_id || r.task_id || null;
  }catch(e){
    finishAuditTurn(chatTurn, auditErrorText(e));
    S.running = false;
    $("#runState").textContent = "启动失败";
    const box = opts.task_id ? $("#taskMsg") : $("#result");
    if(box) box.innerHTML = `<div class="warnbar">启动失败：${esc(e.message)}</div>`;
    $("#runBtn").disabled = false;
    return;
  }

  const es = new EventSource(`/api/audit/${sid}/events`);
  S.es = es;
  const reviewContext = {caseID:reviewCaseID, sid, taskID:S.lastTaskID};
  let receivedReport = false;
  const deliver = rep => {
    if(receivedReport) return;
    receivedReport = true;
    showReport(rep, reviewContext);
    showAuditTurn(chatTurn, rep, reviewContext);
  };
  es.addEventListener("snapshot", e=>{
    const d = JSON.parse(e.data);
    S.evCount = 0;
    (d.events||[]).forEach(addEvent);
    if(d.done && d.report) deliver(d.report);
    if(d.done && d.error) finishAuditTurn(chatTurn, d.error);
  });
  es.addEventListener("event", e=>{ addEvent(JSON.parse(e.data)); });
  es.addEventListener("report", e=>{ deliver(JSON.parse(e.data)); });
  es.addEventListener("done", e=>{
    es.close(); S.es = null;
    S.running = false;
    $("#runBtn").disabled = false;
    const d = JSON.parse(e.data);
    if(!d.ok && !receivedReport && !chatTurn.finished) finishAuditTurn(chatTurn, "这次审核未完成，请重新送审。");
    $("#runState").textContent = d.ok ? "完成" : "异常结束";
    jget("/api/stats").then(x=>{ $("#m-cost").textContent = `本次运行 ${x.sessions||0} 单 · 成本约 $${(x.cost_usd||0).toFixed(5)}`; }).catch(()=>{});
    // 审核结束后保留本轮报告，任务详情通过报告里的按钮打开。
    if(S.lastTaskID) loadTasks();
  });
  es.onerror = ()=>{
    // 浏览器会自动重连；重连后 snapshot 会把已发生的事件补齐。
    if(!S.report) $("#runState").innerHTML = '<span class="spin"></span>连接中断，重连中';
  };
}

function showReport(rep, reviewContext){
  S.report = rep;
  const taskID = reviewContext.taskID;
  renderSteps(null);
  $("#elapsed").textContent = `${rep.elapsed_ms}ms · $${(rep.cost_usd||0).toFixed(5)}`;
  const r = rep.result;
  const rows = (rep.result.findings||[]).map(f=>`<div class="finding-row">
     <div class="h">${f.check_id} ${esc(f.rule_name)} · ${f.clause} → ${DEC[f.outcome]||f.outcome}</div>
     <div class="r">${esc(f.reason)}</div></div>`).join("");

  const skipped = Object.entries(r.skipped||{}).map(([k,v])=>`<div>${k} — ${esc(v)}</div>`).join("");
  const warns = (rep.warnings||[]).map(w=>`<div class="warnbar">${esc(w)}</div>`).join("");
  const fields = rep.extract ? Object.entries(rep.extract.fields||{}).map(([k,v])=>{
    const bad = (rep.extract.untrusted||[]).includes(k) || (rep.extract.low_confidence||[]).includes(k) || !v.value;
    // 置信度取自合并结果；服务端字段名为 confidence 或 conf，两者都兼容，避免显示 0.00 误导。
    const conf = Number(v.conf ?? v.confidence ?? 0);
    const label = {invoice_no:"发票号码",issue_date:"开票日期",total_amount:"价税合计",buyer_tax_id:"购买方税号",
      seller_tax_id:"销售方税号",buyer_name:"购买方",seller_name:"销售方",item_name:"发票项目"}[k]||k;
    return `<tr class="${bad?"bad":""}"><td>${label}</td><td class="v">${esc(v.value||"—")}</td><td>${conf.toFixed(2)}</td></tr>`;
  }).join("") : "";

  // 字段溯源：每个值回原件里指出处。找不到的单独标黄——那可能不是错，但必须让人看一眼。
  const traceBox = (rep.field_trace||[]).length ? (()=>{
    const srcName = {invoice:"发票原文", support:"仅佐证凭证", none:"原件未找到", empty:"空值"};
    const rows = rep.field_trace.map(t=>{
      const cls = t.source==="none" ? "nf" : t.source==="support" ? "sup" : "";
      return `<tr class="${cls}">
        <td class="f">${esc(t.label)}</td>
        <td class="v">${esc(t.value||"—")}
          ${t.snippet?`<div class="q">${esc(t.snippet)}</div>`:""}
          ${t.note?`<div class="q" style="color:var(--warn)">${esc(t.note)}</div>`:""}</td>
        <td><span class="srcbadge ${t.source}">${srcName[t.source]||t.source}</span></td>
      </tr>`;
    }).join("");
    const nf = rep.field_trace.filter(t=>t.source==="none").length;
    return `<h3 style="font-size:12px;color:var(--faint);margin:14px 0 4px">字段溯源
      ${nf?`<span style="color:var(--warn)">（${nf} 个在原件中未找到原文）</span>`:""}</h3>
      <div class="muted" style="margin-bottom:4px">每个值都回到送进模型的那份原文里找过，并摘出上下文。
        「仅佐证凭证」表示发票上没有、只见于辅助材料；「原件未找到」可能是格式改写，也可能是模型补全，建议人工核对。</div>
      <table class="tracetable"><tbody>${rows}</tbody></table>`;
  })() : "";

  const tools = Object.entries(rep.tools||{}).map(([k,v])=>{
    const t = readToolOutcome(v);
    const c = ["ok","found","not_found"].includes(t.status) ? "" : "warnbar";
    return `<div class="${c}" style="margin:4px 0"><b>${esc(toolNames[k] || k)}</b>：${esc(toolStatusText(t))}${t.reason?`<div class="muted">${esc(t.reason)}</div>`:""}</div>`;
  }).join("");

  $("#result").innerHTML = `
    <div class="verdict v-${r.decision}">
      <div class="big">${DEC[r.decision]||r.decision}</div>
      <div class="amt">核准 ${yuan(r.approved_fen)} · 申请 ${yuan(rep.claim_amount_fen)}</div>
      <div class="muted" style="margin-top:6px">${esc(rep.claim_no)} · 命中 ${(r.hits||[]).length} 项</div>
    </div>
    ${taskID?'<button class="ghost" id="reportTaskBtn" style="margin:8px 0">查看任务与补件</button>':""}
    ${warns}
    ${rows || '<div class="muted">没有命中任何判定项</div>'}
    ${skipped?`<div class="skipped" style="margin-top:10px"><details><summary>未判定的项（${Object.keys(r.skipped).length}）</summary>${skipped}</details></div>`:""}
    <h3 style="font-size:12px;color:var(--faint);margin:14px 0 4px">审核意见</h3>
    <div class="op">${esc(rep.opinion)}</div>
    <h3 style="font-size:12px;color:var(--faint);margin:14px 0 4px">抽取字段与置信度</h3>
    <table class="fieldtable"><thead><tr><th>字段</th><th>合并值</th><th>置信度</th></tr></thead><tbody>${fields}</tbody></table>
    ${traceBox}
    <h3 style="font-size:12px;color:var(--faint);margin:14px 0 4px">工具核验${S.toolDataIsMock?" · 模拟数据":""}</h3>
    ${tools}
    <h3 id="manualReviewTitle" tabindex="-1" style="font-size:12px;color:var(--faint);margin:14px 0 4px">人工复核</h3>
    <div class="impact">⚠️ 选择「通过」或「按核准金额通过」会把这张发票写入查重库，
      此后同一张发票会被判为<b>重复报销</b>。写错了可以撤销。</div>
    <input id="reviewNote" placeholder="复核意见（可选）">
    <div class="reviewbtns">
      <button data-d="approve">确认通过</button>
      <button data-d="approve_with_adjustment">按核准金额通过</button>
      <button data-d="need_more_info">退回补材料</button>
      <button data-d="reject">确认驳回</button>
    </div>
    <div id="reviewResult" style="margin-top:8px"></div>
    <div id="reviewList" data-case="${esc(reviewContext.caseID)}" style="margin-top:10px"></div>`;
  if(taskID) $("#reportTaskBtn").onclick = ()=>{ switchTab("tasks"); openTask(taskID); };
  loadReviews();
  $("#result").querySelectorAll(".reviewbtns button").forEach(b=>{
    b.onclick = async ()=>{
      const who = $("#whoSel").value;
      if(!who){ alert("请先在工具栏选择操作人（工号）"); return; }
      try{
        // 带上 session_id：服务端据此用本次真实抽出的发票号写查重记录（真实票据没有标准答案）。
        const r = await jpost("/api/review", {case_id:reviewContext.caseID, claim_no:rep.claim_no, session_id:reviewContext.sid, decision:b.dataset.d,
          note:$("#reviewNote").value, employee_id:who, decision_before:rep.result.decision});
        b.textContent = "已记录 ✓";
        b.disabled = true;
        const imp = r.impact || {};
        $("#reviewResult").innerHTML = `<div class="warnbar">${esc(imp.message||"")}</div>`;
        if(r.task_state==="approved") {
          $("#reviewResult").insertAdjacentHTML("afterbegin", '<div class="upok">人工复核通过，已进入「已通过」列表。</div>');
        } else if(r.task_note) {
          $("#reviewResult").insertAdjacentHTML("beforeend", `<div class="warnbar">${esc(r.task_note)}</div>`);
        }
        await Promise.all([loadReviews(), loadTasks()]);
      }catch(e){ alert("记录失败：" + e.message); }
    };
  });
}

// ---- 真实票据上传 ----
// 上传成功后单据进入「全部单据」，也能直接在任务列表里被审。
// 界面上要说清楚：提取失败就是失败，不会拿半份文本蒙混过关。

const uploadFields = {
  category:"类别", applicant_id:"工号", request_no:"申请单号", applicant_name:"姓名",
  from_city:"出发城市", city:"到达城市", start_date:"开始日期", end_date:"结束日期",
  purpose:"事由", amount:"金额"
};
const autoUploadValues = new Map();
let uploadPreviewController;

for(const key of Object.keys(uploadFields)){
  $("#up_"+key).addEventListener("input",()=>autoUploadValues.delete(key));
}

async function previewUpload(){
  uploadPreviewController?.abort();
  uploadPreviewController = undefined;
  for(const [key,value] of autoUploadValues){
    if($("#up_"+key).value===value) $("#up_"+key).value="";
  }
  autoUploadValues.clear();
  const invoice = $("#up_invoice").files[0];
  const status = $("#upPreview");
  status.hidden = !invoice;
  if(!invoice) return;
  const controller = new AbortController();
  uploadPreviewController = controller;
  status.textContent = "正在识别票据…";
  const form = new FormData();
  form.append("invoice",invoice);
  const support = $("#up_support").files[0];
  if(support) form.append("support",support);
  try{
    const res = await fetch("/api/upload/preview",{method:"POST",body:form,signal:controller.signal});
    const data = await res.json();
    if(controller.signal.aborted) return;
    if(!res.ok) throw new Error(data.error || "无法识别票据");
    $("#up_request_no").placeholder = data.demo_request_no ? "演示时留空会自动生成" : "填写已有的申请单号";
    data.amount = data.amount_fen == null ? "" : (data.amount_fen/100).toFixed(2);
    const filled = [];
    for(const [key,label] of Object.entries(uploadFields)){
      const input = $("#up_"+key);
      if(input.value || !data[key]) continue;
      input.value = data[key];
      autoUploadValues.set(key,input.value);
      filled.push(key==="amount" ? "金额 ¥"+data.amount : label);
    }
    status.textContent = [
      data.invoice_no ? "发票 "+data.invoice_no : "",
      filled.length ? "已填入"+filled.join("、")+"，提交前可修改" : "",
      data.embedded_support ? "已从同一 PDF 读取佐证凭证" : "",
      ...(data.warnings || [])
    ].filter(Boolean).join(" · ");
  }catch(e){
    if(!controller.signal.aborted) status.textContent = "自动识别失败："+e.message;
  }finally{
    if(uploadPreviewController===controller) uploadPreviewController=undefined;
  }
}

async function uploadInvoice(){
  if(S.running || $("#chatAuditExisting").disabled){ $("#upResult").textContent = "请等本次审核完成后再送审。"; return; }
  const btn = $("#upBtn");
  const inv = $("#up_invoice").files[0];
  if(!inv){ $("#upResult").innerHTML = '<div class="upbad">请选择发票文件</div>'; return; }
  if(uploadPreviewController){ $("#upResult").textContent = "正在识别票据，请稍等。"; return; }
  const cat = $("#up_category").value;
  if(!cat){ $("#upResult").textContent = "请选择报销类别。"; $("#up_category").focus(); return; }
  const emp = $("#up_applicant_id").value.trim();
  if(!emp){ $("#upResult").innerHTML = '<div class="upbad">请填写申请人工号</div>'; return; }

  const fd = new FormData();
  const put = (k, v) => { if(v !== undefined && v !== null && String(v) !== "") fd.append(k, v); };
  put("request_no", $("#up_request_no").value.trim());
  put("category", cat);
  put("applicant_id", emp);
  put("applicant_name", $("#up_applicant_name").value.trim());
  put("from_city", $("#up_from_city").value.trim());
  put("city", $("#up_city").value.trim());
  put("start_date", $("#up_start_date").value);
  put("end_date", $("#up_end_date").value);
  put("purpose", $("#up_purpose").value.trim());
  const amt = $("#up_amount").value.trim();
  if(amt){ put("amount_fen", String(Math.round(parseFloat(amt)*100))); }
  fd.append("invoice", inv);
  const sup = $("#up_support").files[0];
  if(sup) fd.append("support", sup);

  btn.disabled = true;
  btn.textContent = "上传中…";
  $("#upResult").innerHTML = "";
  // 明确告诉用户在传什么、多大：大文件在慢网络下要等几秒，
  // 没反馈会让人以为按钮坏了而反复点。
  const kb = Math.round(inv.size/1024);
  $("#upStatus").textContent = `正在上传 ${inv.name}（${kb} KB）…`;
  try{
    const r = await fetch("/api/upload", {method:"POST", body: fd});
    const d = await r.json();
    if(!r.ok || !d.ok){
      // 失败时把"该怎么办"一起显示：用户改不了的问题（扫描件/加密）要明说。
      $("#upResult").innerHTML = `<div class="upbad">上传失败：${esc(d.error||"未知错误")}
        ${d.action?`<div style="margin-top:4px;color:var(--dim)">${esc(d.action)}</div>`:""}</div>`;
      return;
    }
    $("#upResult").innerHTML = `<div class="upok">
      已建单 <b>${esc(d.claim_no || d.case_id)}</b>${d.request_no?" · 申请单 "+esc(d.request_no):""}<br>
      发票号码 ${esc(d.invoice_no||"未能识别")} · 提取 ${d.invoice_chars} 字
      ${d.has_support?"· 佐证凭证已提取":"· 无佐证凭证"}<br>
      ${(d.warnings||[]).map(w=>`<div style="color:#e3c07b">⚠ ${esc(w)}</div>`).join("")}
      <div style="margin-top:6px;color:var(--dim)">${esc(d.next||"")}</div></div>`;
    // 让新单据出现在列表里，并直接选中，省一次点击。
    await loadCases();
    await select(d.case_id);
    switchTab("cases");
    autoUploadValues.clear();
    for(const key of Object.keys(uploadFields)){
      if(key!=="applicant_id") $("#up_"+key).value="";
    }
    $("#up_invoice").value = "";
    $("#up_support").value = "";
    $("#upMore").open = false;
    $("#upPreview").hidden = true;
    $("#chatAttachment").open = false;
    $("#chatAttachment").hidden = true;
    setWorkbench(false);
    await startAudit({label:inv.name+" · "+(d.claim_no || d.case_id)+(d.request_no?" · "+d.request_no:"")});
  }catch(e){
    $("#upResult").innerHTML = `<div class="upbad">上传请求失败：${esc(e.message)}</div>`;
  }finally{
    btn.disabled = false;
    btn.textContent = "上传并送审";
    if($("#upStatus")) $("#upStatus").textContent = "";
  }
}

// 用样例发票：拉一份 PDF，作为 File 塞进文件框。
// 走 DataTransfer 而不是让用户手选，方便演示与自测；
// 也能绕过某些环境里原生文件选择器不可用的问题。
async function useSampleInvoice(){
  const st = $("#upStatus");
  st.textContent = "正在取样例发票…";
  try{
    const r = await fetch("/api/sample-invoice");
    if(!r.ok) throw new Error("样例发票不可用");
    const blob = await r.blob();
    const f = new File([blob], "sample-invoice.pdf", {type:"application/pdf"});
    const dt = new DataTransfer();
    dt.items.add(f);
    $("#up_invoice").files = dt.files;
    st.textContent = `已填入 ${f.name}（${Math.round(f.size/1024)} KB），点「上传并送审」`;
    // 顺手把必填项填上，减少演示时的输入。
    await previewUpload();
    if(!$("#up_category").value){ $("#up_category").value = "transport"; autoUploadValues.set("category","transport"); }
    if(!$("#up_applicant_id").value){ $("#up_applicant_id").value = "E1001"; autoUploadValues.set("applicant_id","E1001"); }
  }catch(e){
    st.textContent = "取样例失败：" + e.message;
  }
}

$("#upSample").onclick = useSampleInvoice;
$("#upBtn").onclick = uploadInvoice;
$("#tabTasks").onclick = ()=>switchTab("tasks");
$("#tabCases").onclick = ()=>switchTab("cases");
$("#tabUpload").onclick = ()=>openChatAttachment();
boot().catch(e=>{ document.body.insertAdjacentHTML("afterbegin", `<div class="warnbar" style="margin:10px">界面初始化失败：${esc(e.message)}</div>`); });
</script>
<script src="/ui/review-tools.js"></script>
<script src="/ui/chat.js"></script>
</body>
</html>
